# Self-hosted deployment. From the repo root:  docker compose up --build
# The backend build context is the repo root so the bundled reference engine
# (packages/engine) is vendored into the image.
services:
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    environment:
      OLEFLIP_DB_PATH: /data/oleflip.db
      PHASE1_PATH: /phase1
      API_KEY: ${API_KEY:-}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - oleflip-data:/data # inventory persists across rebuilds
    ports:
      - "8000:8000"

  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
    environment:
      API_BASE: http://backend:8000
      API_KEY: ${API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  oleflip-data:
