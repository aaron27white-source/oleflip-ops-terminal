version: 2
updates:
  - package-ecosystem: npm
    directory: /packages/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # Auto-propose only minor/patch. Major bumps (Next 16, Tailwind 4, TS 7,
    # @types/node) are breaking and handled as deliberate migrations, not auto-PRs.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /packages/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
